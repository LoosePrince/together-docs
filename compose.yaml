services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/app.db
      LOCAL_STORAGE_DIR: /app/data/blobs
      SESSION_SECRET: ${SESSION_SECRET:?请先在 .env 中设置 SESSION_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
